<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload X-Ray - Bone Fracture Detection</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">BoneFracture AI</div>
            <div class="nav-menu">
                <a href="/">Home</a>
                <a href="/dashboard.html">Dashboard</a>
                <a href="/upload.html" class="active">Upload X-Ray</a>
                <a href="/reports.html">Reports</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </nav>

        <div class="upload-container">
            <h1>Upload X-Ray Image</h1>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <p>Drag and drop your X-ray image here or click to browse</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button onclick="document.getElementById('fileInput').click()" class="btn-secondary">
                    Browse Files
                </button>
                <p class="file-info">Supported formats: JPG, PNG, JPEG</p>
            </div>

            <div id="previewArea" style="display: none;">
                <h2>Image Preview</h2>
                <img id="imagePreview" src="" alt="Preview" style="max-width: 100%; max-height: 400px;">
                <div class="preview-actions">
                    <button onclick="analyzeImage()" class="btn-primary">Analyze Image</button>
                    <button onclick="resetUpload()" class="btn-secondary">Upload Different</button>
                </div>
            </div>

            <div id="resultsArea" style="display: none;">
                <h2>Analysis Results</h2>
                <div class="result-card">
                    <div class="result-status" id="resultStatus"></div>
                    <div class="result-details">
                        <p><strong>Fracture Type:</strong> <span id="fractureType"></span></p>
                        <p><strong>Confidence Score:</strong> <span id="confidenceScore"></span></p>
                        <p><strong>Severity:</strong> <span id="severityLevel"></span></p>
                    </div>
                    <h3>Treatment Suggestions</h3>
                    <p id="treatmentSuggestion"></p>
                    <button onclick="generateReport()" class="btn-primary">Generate Report</button>
                </div>
            </div>

            <div id="loadingSpinner" style="display: none; text-align: center;">
                <div class="spinner"></div>
                <p>Analyzing image...</p>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
