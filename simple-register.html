<!DOCTYPE html>
<html>
<head>
    <title>Simple Register</title>
</head>
<body>
    <h2>Simple Registration</h2>
    <form id="registerForm">
        <div>
            <label>Name:</label>
            <input type="text" id="name" value="Test User" required>
        </div>
        <br>
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="test@test.com" required>
        </div>
        <br>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="password123" required>
        </div>
        <br>
        <button type="submit">Register</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            document.getElementById('result').innerHTML = 'Sending...';
            
            try {
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const responseText = await response.text();
                document.getElementById('result').innerHTML = 
                    'Status: ' + response.status + '<br>' +
                    'Response: ' + responseText;
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
